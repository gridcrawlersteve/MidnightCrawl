<!doctype html><html><head><meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no'><title>Midnight Crawl Prototype</title><style>html,body{touch-action:manipulation}body{margin:0;background:#0b0907;color:#ead9ad;font-family:Georgia,serif;display:flex;justify-content:center}.app{width:min(100vw,520px);min-height:100vh;background:#15100b;padding:14px;box-sizing:border-box}.panel{border:1px solid #725c34;background:#100d09;padding:12px;margin:8px 0}h1{font-size:22px;text-align:center;margin:4px}.muted{color:#a99772;font-size:13px}.btn{background:#2a2114;color:#f2dfad;border:1px solid #8c713d;padding:10px;margin:4px;font:inherit;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}.btn:active{background:#49391f}.view{height:245px;position:relative;overflow:hidden;background:#030303;border:1px solid #75603a}.location{border:1px solid #4d422d;background:#0d0b08;padding:10px 12px;margin:8px 0;text-align:center;min-height:42px}.location b{display:block;font-size:12px;letter-spacing:1px;color:#8f7a50;margin-bottom:4px}.location span{font-size:14px;line-height:1.35}.map{font-family:monospace;white-space:pre;line-height:11px;font-size:11px;background:#050505;color:#bda873;padding:7px;overflow:auto}#mapPanel{position:fixed;left:50%;top:14px;transform:translateX(-50%);width:min(calc(100vw - 28px),492px);height:245px;margin:0!important;z-index:999;box-sizing:border-box;background:#050505f5;overflow:auto;padding:12px}.controls{text-align:center;margin:10px 0;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}.wasd{display:grid;grid-template-columns:58px 58px 58px;grid-template-rows:58px 58px;gap:6px;justify-content:center;touch-action:none}.key{width:58px;height:58px;margin:0;padding:0;font-size:24px;font-weight:bold;touch-action:none}.key.w{grid-column:2;grid-row:1}.key.a{grid-column:1;grid-row:2}.key.s{grid-column:2;grid-row:2}.key.d{grid-column:3;grid-row:2}.utility{text-align:center;margin-top:8px}.utility .btn{padding:7px 14px;font-size:13px;color:#bdaa80}.log{height:90px;overflow:auto;font-size:13px}.combat{display:none;text-align:center;margin:10px 0}.combat .btn{min-width:82px}.combatMsg{min-height:44px;margin:8px 12px;font-size:14px;line-height:1.35}.reward{color:#d8c48f;font-family:monospace}.rewardBox{display:none;text-align:center;padding:16px 8px}.rewardBox h2{font-size:20px;letter-spacing:2px}.rewardBox .btn{min-width:105px}.enemy{font-size:72px;line-height:1;margin-top:45px}.enemyName{font-size:18px;letter-spacing:2px;margin-top:8px}.hp{font-family:monospace;margin:8px 0;color:#d8c48f}</style></head><body><div class='app'><h1>⚔ MIDNIGHT CRAWL ⚔</h1><div class='muted' style='text-align:center'>Sword & sorcery dungeon prototype · v0.50 WIZARDRY PORT</div><div class='view' id='view'></div><div class='location'><b id='locationTitle'>YOUR SURROUNDINGS</b><span id='description'></span></div><div class='controls' id='controls'><div class='wasd'><button class='btn key w' data-action='w'>W</button><button class='btn key a' data-action='a'>A</button><button class='btn key s' data-action='s'>S</button><button class='btn key d' data-action='d'>D</button></div><div class='utility'><button class='btn' id='musicButton' onclick='toggleMusic()'>♪ MUSIC</button><button class='btn' id='mapButton' onclick='toggleMap()'>MAP</button><button class='btn' onclick='save()'>SAVE</button><button class='btn' onclick='restart()'>RESTART</button></div></div><audio id='music' loop preload='none' src='https://opengameart.org/sites/default/files/slow_melancholic_theme_c64_style.ogg'></audio><div class='rewardBox' id='rewardBox'></div><div class='combat' id='combat'><div class='hp' id='hp'></div><div class='combatMsg' id='combatMsg'></div><button class='btn' onclick="combatAction('fight')">FIGHT</button><button class='btn' onclick="combatAction('parry')">PARRY</button><button class='btn' onclick="combatAction('spell')">SPELL</button><button class='btn' onclick="combatAction('run')">RUN</button></div><div class='panel' id='mapPanel' style='display:none'><b>AUTOMAP</b><div id='map' class='map'></div></div><div class='panel log' id='log' style='display:none'></div><script src="../wasm_exec.js"></script><script>
let engineReady=false,engineState=null,engineWalls=null;
function syncEngine(raw){try{const s=typeof raw==='string'?JSON.parse(raw):raw;if(!s||!Array.isArray(s.walls))return false;engineState=s;engineWalls=s.walls;x=s.x;y=s.y;dir=s.facing;return true}catch(e){console.error(e);return false}}
async function bootEngine(){try{const go=new Go();let r;try{r=await WebAssembly.instantiateStreaming(fetch('../wizardry.wasm'),go.importObject)}catch(e){const b=await (await fetch('../wizardry.wasm')).arrayBuffer();r=await WebAssembly.instantiate(b,go.importObject)}go.run(r.instance);for(let i=0;i<100&&!window.mcEngineInit;i++)await new Promise(q=>setTimeout(q,10));if(!window.mcEngineInit)throw new Error('bridge unavailable');if(!syncEngine(window.mcEngineInit()))throw new Error('maze state unavailable');engineReady=true;seen=new Set();reveal();render();say('Wizardry maze engine online.')}catch(e){console.error(e);say('Wizardry engine unavailable; using prototype dungeon.')}}function engineWall(xx,yy,d){if(!engineWalls||!engineWalls[yy]||!engineWalls[yy][xx])return true;const k=['n','e','s','w'][d],w=engineWalls[yy][xx][k];return w!=='open'}function cellWall(xx,yy,d){return engineReady?engineWall(xx,yy,d):wallAt(xx+dirs[d][0],yy+dirs[d][1])}
const grid=["###############","#.....#.......#","#.###.#.#####.#","#.#...#.....#.#","#.#.#######.#.#","#.#.........#.#","#.###########.#","#.............#","###.#######.###","#...#.....#...#","#.###.###.###.#","#.....#.#.....#","#####.#.#####.#","#.............#","###############"];let x=1,y=1,dir=1,seen=new Set(),inCombat=false,mapOpen=false,playerHP=20,playerMaxHP=20,playerLevel=1,playerXP=0,gold=0,playerAC=10,enemyHP=0,enemyMaxHP=0,enemyAC=8,combatRound=1,combatMessage='',pendingXP=0,pendingGold=0,chestTrap=0,encounterDone=false;const dirs=[[0,-1],[1,0],[0,1],[-1,0]];function wallAt(xx,yy){return !grid[yy]||grid[yy][xx]=='#'}function describe(){let open=[];for(let i=0;i<4;i++){let[dxx,dyy]=dirs[i];if(!wallAt(x+dxx,y+dyy))open.push(i)}if(open.length===1)return'The passage ends at a blank wall of fitted stone.';if(open.length===2&&((open[0]+2)%4===open[1]))return'A narrow stone corridor runs through the darkness.';if(open.length===2)return'The passage bends sharply here.';if(open.length===3)return'A three-way junction opens through worn stonework.';return'Cold air moves through the ancient masonry.'}function move(n){if(inCombat||mapOpen)return false;if(engineReady){if(n<0){say('Backward movement will return with full engine controls.');return false}const bx=x,by=y;if(!syncEngine(window.mcEngineMove()))return false;if(x===bx&&y===by){say('Stone blocks your path.');render();return false}reveal();render();return true}let[dx,dy]=dirs[dir],nx=x+dx*n,ny=y+dy*n;if(wallAt(nx,ny)){say('Stone blocks your path.');return false}x=nx;y=ny;reveal();if(!encounterDone&&x===3&&y===1){startCombat();return false}render();autosave();return true}function turn(n){if(inCombat||mapOpen)return false;if(engineReady){if(!syncEngine(window.mcEngineTurn(n<0?'left':'right')))return false}else dir=(dir+n+4)%4;render();autosave();return true}function reveal(){for(let yy=y-1;yy<=y+1;yy++)for(let xx=x-1;xx<=x+1;xx++)seen.add(xx+','+yy)}function render(){document.getElementById('rewardBox').style.display='none';if(inCombat){renderCombat();return}document.getElementById('controls').style.display='block';document.getElementById('combat').style.display='none';document.getElementById('mapPanel').style.display='none';document.getElementById('locationTitle').textContent='YOUR SURROUNDINGS';renderView();document.getElementById('description').textContent=describe();let out='';for(let yy=0;yy<grid.length;yy++){for(let xx=0;xx<grid[0].length;xx++){let k=xx+','+yy;if(xx==x&&yy==y)out+='^>v<'[dir];else if(!seen.has(k))out+=' ';else out+=grid[yy][xx]=='#'?'█':'·'}out+='\n'}document.getElementById('map').textContent=out}function renderView(){const v=document.getElementById('view');v.innerHTML='';const MW=82,MH=79,pix=Array.from({length:MH},()=>Array(MW).fill(false));let clipL=0,clipR=81;const dot=(xx,yy)=>{if(xx>=clipL&&xx<=clipR&&yy>=0&&yy<=78&&xx>=0&&xx<82)pix[yy][xx]=true};const dl=(xx,yy,dh,dv,n)=>{for(let i=0;i<n;i++){dot(xx,yy);xx+=dh;yy+=dv}};const shift=(xx,yy,right,fwd)=>{switch(dir){case 0:xx+=right;yy-=fwd;break;case 1:xx+=fwd;yy+=right;break;case 2:xx-=right;yy+=fwd;break;case 3:xx-=fwd;yy-=right}return[xx,yy]};const isOpen=(xx,yy,side)=>{const d=(dir+(side==='L'?3:side==='R'?1:0))%4;return !cellWall(xx,yy,d)};const front=(ul,lr,ww,wh,off)=>{dl(ul+off,ul,1,0,wh);dl(ul+off,ul,0,1,wh);dl(ul+off+wh,ul,0,1,wh+1);dl(ul+off,ul+wh,1,0,wh)};let ul=8,lr=72,ww=32,wh=64,cx=x,cy=y,xlower=0,xupper=81;for(let lightDis=5;lightDis>0;lightDis--){clipL=xlower;clipR=xupper;if(!isOpen(cx,cy,'L')){xlower=ul;dl(ul,ul,-1,-1,ww);dl(ul,ul,0,1,wh);dl(ul,lr,-1,1,ww);dl(ul-ww,ul-ww,0,1,wh*2)}else{const[p,q]=shift(cx,cy,-1,0);if(!isOpen(p,q,'F')){front(ul,lr,ww,wh,-2*ww);xlower=ul}}if(!isOpen(cx,cy,'R')){xupper=lr;dl(lr,ul,1,-1,ww);dl(lr,ul,0,1,wh);dl(lr,lr,1,1,ww);dl(lr+ww,ul-ww,0,1,wh*2)}else{const[p,q]=shift(cx,cy,1,0);if(!isOpen(p,q,'F')){front(ul,lr,ww,wh,2*ww);xupper=lr}}if(!isOpen(cx,cy,'F')){front(ul,lr,ww,wh,0);break}ww=Math.floor(ww/2);wh=ww*2;ul+=ww;lr-=ww;[cx,cy]=shift(cx,cy,0,1)}const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 82 79');svg.setAttribute('width','100%');svg.setAttribute('height','100%');svg.setAttribute('preserveAspectRatio','none');let path='';for(let yy=0;yy<MH;yy++)for(let xx=0;xx<MW;xx++)if(pix[yy][xx])path+=`M${xx} ${yy}h1v1h-1z`;const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',path);p.setAttribute('fill','#b9a06a');svg.appendChild(p);v.appendChild(svg)}function toggleMusic(){const a=document.getElementById('music'),b=document.getElementById('musicButton');a.volume=.32;if(a.paused){a.play().then(()=>b.textContent='♪ ON').catch(()=>say('Tap MUSIC again to start audio.'))}else{a.pause();b.textContent='♪ MUSIC'}}function toggleMap(){if(inCombat)return;stopRepeat();mapOpen=!mapOpen;const v=document.getElementById('view'),mp=document.getElementById('mapPanel'),btn=document.getElementById('mapButton');if(mapOpen){render();mp.style.display='block';btn.textContent='RETURN';document.getElementById('locationTitle').textContent='DUNGEON MAP';document.getElementById('description').textContent='Only the passages you have explored are shown.'}else{mp.style.display='none';btn.textContent='MAP';render()}}function roll(n){return Math.floor(Math.random()*n)+1}function startCombat(){stopRepeat();inCombat=true;combatRound=1;enemyMaxHP=roll(8)+4;enemyHP=enemyMaxHP;enemyAC=8;combatMessage='A SKELETON rises from the darkness!';say(combatMessage);renderCombat()}function renderCombat(){document.getElementById('controls').style.display='none';document.getElementById('combat').style.display='block';document.getElementById('mapPanel').style.display='none';document.getElementById('locationTitle').textContent='ENCOUNTER · ROUND '+combatRound;document.getElementById('description').textContent='A rusted blade hangs in the skeletal warrior’s hand.';document.getElementById('hp').textContent=`YOU ${playerHP}/${playerMaxHP} HP  AC ${playerAC} · SKELETON ${Math.max(0,enemyHP)}/${enemyMaxHP} HP`;document.getElementById('combatMsg').textContent=combatMessage;document.getElementById('view').innerHTML="<div class='enemy'>☠</div><div class='enemyName'>SKELETON</div>"}function attackRoll(ac){return roll(20)>=Math.max(2,ac)}function combatAction(a){if(!inCombat)return;let msgs=[];if(a==='run'){if(roll(100)<=65){combatMessage='You escape into the corridor.';say(combatMessage);endCombat(false);return}msgs.push('You fail to escape!')}else if(a==='spell'){msgs.push('You know no spells yet.')}else if(a==='fight'){if(attackRoll(enemyAC)){const d=roll(5)+2;enemyHP-=d;msgs.push('You hit the Skeleton for '+d+' damage.')}else msgs.push('Your attack misses.')}else if(a==='parry'){msgs.push('You parry, improving your defense this round.')}if(enemyHP<=0){pendingXP=35;pendingGold=8+roll(17);combatMessage=msgs.join(' ')+' The Skeleton collapses!';say(combatMessage);showVictory();return}const effectiveAC=a==='parry'?playerAC-2:playerAC;if(attackRoll(effectiveAC)){const ed=roll(4);playerHP-=ed;msgs.push('The Skeleton hits you for '+ed+' damage.')}else msgs.push('The Skeleton misses.');if(playerHP<=0){playerHP=playerMaxHP;combatMessage=msgs.join(' ')+' You fall... and awaken at the dungeon entrance.';say(combatMessage);x=1;y=1;dir=1;endCombat(true);return}combatRound++;combatMessage=msgs.join(' ');say(combatMessage);renderCombat();autosave()}function showVictory(){inCombat=true;document.getElementById('controls').style.display='none';document.getElementById('combat').style.display='none';document.getElementById('locationTitle').textContent='VICTORY';document.getElementById('description').textContent='The battle is over.';document.getElementById('view').innerHTML="<div class='enemy' style='font-size:54px'>☠</div><div class='enemyName'>VICTORY</div>";const r=document.getElementById('rewardBox');r.style.display='block';r.innerHTML="<h2>VICTORY!</h2><div class='reward'>"+pendingXP+" EXPERIENCE POINTS</div><p>A small iron-bound chest lies among the bones.</p><button class='btn' onclick='openChest()'>OPEN CHEST</button><button class='btn' onclick='leaveChest()'>LEAVE</button>"}function openChest(){chestTrap=roll(100)<=25?1:0;const r=document.getElementById('rewardBox');if(chestTrap){const d=roll(4);playerHP=Math.max(1,playerHP-d);r.innerHTML="<h2>CHEST</h2><p>A needle snaps from the lock! You suffer "+d+" damage.</p><div class='reward'>"+pendingGold+" GOLD PIECES</div><button class='btn' onclick='claimRewards()'>CONTINUE</button>"}else r.innerHTML="<h2>CHEST</h2><p>The lock gives with a dry click.</p><div class='reward'>"+pendingGold+" GOLD PIECES</div><button class='btn' onclick='claimRewards()'>CONTINUE</button>"}function leaveChest(){playerXP+=pendingXP;pendingXP=pendingGold=0;document.getElementById('rewardBox').style.display='none';endCombat(true)}function claimRewards(){playerXP+=pendingXP;gold+=pendingGold;combatMessage='You receive '+pendingXP+' XP and '+pendingGold+' gold.';say(combatMessage);pendingXP=pendingGold=0;document.getElementById('rewardBox').style.display='none';endCombat(true)}function endCombat(defeated){inCombat=false;if(defeated)encounterDone=true;render();autosave()}function say(t){let l=document.getElementById('log');l.innerHTML+=t+'<br>';l.scrollTop=l.scrollHeight}function autosave(){try{localStorage.setItem('mc_save_v020',JSON.stringify({x,y,dir,seen:[...seen],playerHP,playerMaxHP,playerLevel,playerXP,gold,playerAC,encounterDone}))}catch(e){}}function save(){autosave();say('Your expedition has been saved.')}function restart(){stopRepeat();mapOpen=false;const mp=document.getElementById('mapPanel'),mb=document.getElementById('mapButton');if(mp)mp.style.display='none';if(mb)mb.textContent='MAP';inCombat=false;x=1;y=1;dir=1;playerHP=playerMaxHP;playerXP=0;gold=0;encounterDone=false;seen=new Set();try{localStorage.removeItem('mc_save_v020')}catch(e){}reveal();render();say('The dungeon resets around you.')}function start(){try{let s=localStorage.getItem('mc_save_v020')||localStorage.getItem('mc_save_v019')||localStorage.getItem('mc_save_v018')||localStorage.getItem('mc_save_v016')||localStorage.getItem('mc_save_v015')||localStorage.getItem('mc_save_v014')||localStorage.getItem('mc_save_v013')||localStorage.getItem('mc_save_v012');if(s){let z=JSON.parse(s);x=z.x??x;y=z.y??y;dir=z.dir??dir;seen=new Set(z.seen||[]);playerHP=z.playerHP??20;playerMaxHP=z.playerMaxHP??20;playerLevel=z.playerLevel??1;playerXP=z.playerXP??0;gold=z.gold??0;playerAC=z.playerAC??10;encounterDone=z.encounterDone??false}}catch(e){}reveal();render();say('Cold air rises from the dark.')}const action=k=>k==='w'?move(1):k==='s'?move(-1):k==='a'?turn(-1):turn(1);let repeatDelay=null,repeatTimer=null,held=null;function stopRepeat(){clearTimeout(repeatDelay);clearInterval(repeatTimer);repeatDelay=repeatTimer=null;held=null}function beginRepeat(k){if(held||inCombat)return;held=k;action(k);repeatDelay=setTimeout(()=>{repeatTimer=setInterval(()=>{if(!action(k)&&(k==='w'||k==='s'))stopRepeat()},125)},500)}document.querySelectorAll('.key').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture?.(e.pointerId);beginRepeat(b.dataset.action)});b.addEventListener('pointerup',stopRepeat);b.addEventListener('pointercancel',stopRepeat);b.addEventListener('lostpointercapture',stopRepeat);b.addEventListener('contextmenu',e=>e.preventDefault())});document.addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(!'wasd'.includes(k))return;e.preventDefault();if(!e.repeat)beginRepeat(k)});document.addEventListener('keyup',e=>{if('wasd'.includes(e.key.toLowerCase()))stopRepeat()});window.addEventListener('blur',stopRepeat);requestAnimationFrame(()=>{start();bootEngine()});</script></div></body></html>
