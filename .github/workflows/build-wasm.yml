name: Build and publish Wizardry preview
on:
  push:
    branches: [v0.5]
    paths-ignore: [wizardry.wasm, wasm_exec.js]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wizardry-preview
  cancel-in-progress: false
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build full Wizardry browser game
        run: |
          GOOS=js GOARCH=wasm go build -o wizardry.wasm ./cmd/web
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" wasm_exec.js
          go test ./engine ./data ./scenarios/...
          (cd tests && node browser-engine.cjs)
      - name: Publish isolated v05 assets while preserving the main game
        run: |
          mkdir -p /tmp/v05-preview
          cp index.html wizardry.wasm wasm_exec.js /tmp/v05-preview/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wizardry.wasm wasm_exec.js
          git diff --cached --quiet || git commit -m "Build full Wizardry WebAssembly game"
          git push origin HEAD:v0.5
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p v05
          cp /tmp/v05-preview/* v05/
          git add v05
          git diff --cached --quiet || git commit -m "Publish full Wizardry v0.5 preview"
          git push origin HEAD:main
