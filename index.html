<!doctype html><html><head><meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no'><title>Midnight Crawl Prototype</title><style>html,body{touch-action:manipulation}body{margin:0;background:#0b0907;color:#ead9ad;font-family:Georgia,serif;display:flex;justify-content:center}.app{width:min(100vw,520px);min-height:100vh;background:#15100b;padding:14px;box-sizing:border-box}.panel{border:1px solid #725c34;background:#100d09;padding:12px;margin:8px 0}h1{font-size:22px;text-align:center;margin:4px}.muted{color:#a99772;font-size:13px}.btn{background:#2a2114;color:#f2dfad;border:1px solid #8c713d;padding:10px;margin:4px;font:inherit;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}.btn:active{background:#49391f}.view{height:245px;position:relative;overflow:hidden;background:#030303;border:1px solid #75603a}.location{border:1px solid #4d422d;background:#0d0b08;padding:10px 12px;margin:8px 0;text-align:center;min-height:42px}.location b{display:block;font-size:12px;letter-spacing:1px;color:#8f7a50;margin-bottom:4px}.location span{font-size:14px;line-height:1.35}.map{font-family:monospace;white-space:pre;line-height:11px;font-size:11px;background:#050505;color:#bda873;padding:7px;overflow:auto}.controls{text-align:center;margin:10px 0;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}.wasd{display:grid;grid-template-columns:58px 58px 58px;grid-template-rows:58px 58px;gap:6px;justify-content:center;touch-action:none}.key{width:58px;height:58px;margin:0;padding:0;font-size:24px;font-weight:bold;touch-action:none}.key.w{grid-column:2;grid-row:1}.key.a{grid-column:1;grid-row:2}.key.s{grid-column:2;grid-row:2}.key.d{grid-column:3;grid-row:2}.utility{text-align:center;margin-top:8px}.utility .btn{padding:7px 14px;font-size:13px;color:#bdaa80}.log{height:90px;overflow:auto;font-size:13px}.combat{display:none;text-align:center;margin:10px 0}.combat .btn{min-width:92px}.enemy{font-size:72px;line-height:1;margin-top:45px}.enemyName{font-size:18px;letter-spacing:2px;margin-top:8px}.hp{font-family:monospace;margin:8px 0;color:#d8c48f}</style></head><body><div class='app'><h1>⚔ MIDNIGHT CRAWL ⚔</h1><div class='muted' style='text-align:center'>Sword & sorcery dungeon prototype · v0.14</div><div class='view' id='view'></div><div class='location'><b id='locationTitle'>YOUR SURROUNDINGS</b><span id='description'></span></div><div class='controls' id='controls'><div class='wasd'><button class='btn key w' data-action='w'>W</button><button class='btn key a' data-action='a'>A</button><button class='btn key s' data-action='s'>S</button><button class='btn key d' data-action='d'>D</button></div><div class='utility'><button class='btn' onclick='save()'>SAVE</button><button class='btn' onclick='restart()'>RESTART</button></div></div><div class='combat' id='combat'><div class='hp' id='hp'></div><button class='btn' onclick="combatAction('fight')">FIGHT</button><button class='btn' onclick="combatAction('defend')">DEFEND</button><button class='btn' onclick="combatAction('spell')">SPELL</button><button class='btn' onclick="combatAction('run')">RUN</button></div><div class='panel' id='mapPanel'><b>AUTOMAP</b><div id='map' class='map'></div></div><div class='panel log' id='log'></div><script>const grid=["###############","#.....#.......#","#.###.#.#####.#","#.#...#.....#.#","#.#.#######.#.#","#.#.........#.#","#.###########.#","#.............#","###.#######.###","#...#.....#...#","#.###.###.###.#","#.....#.#.....#","#####.#.#####.#","#.............#","###############"];let x=1,y=1,dir=1,seen=new Set(),inCombat=false,playerHP=20,enemyHP=0,encounterDone=false;const dirs=[[0,-1],[1,0],[0,1],[-1,0]];function wallAt(xx,yy){return !grid[yy]||grid[yy][xx]=='#'}function describe(){let open=[];for(let i=0;i<4;i++){let[dxx,dyy]=dirs[i];if(!wallAt(x+dxx,y+dyy))open.push(i)}if(open.length===1)return'The passage ends at a blank wall of fitted stone.';if(open.length===2&&((open[0]+2)%4===open[1]))return'A narrow stone corridor runs through the darkness.';if(open.length===2)return'The passage bends sharply here.';if(open.length===3)return'A three-way junction opens through worn stonework.';return'Cold air moves through the ancient masonry.'}function move(n){if(inCombat)return false;let[dx,dy]=dirs[dir],nx=x+dx*n,ny=y+dy*n;if(wallAt(nx,ny)){say('Stone blocks your path.');return false}x=nx;y=ny;reveal();if(!encounterDone&&x===3&&y===1){startCombat();return false}render();autosave();return true}function turn(n){if(inCombat)return false;dir=(dir+n+4)%4;render();autosave();return true}function reveal(){for(let yy=y-1;yy<=y+1;yy++)for(let xx=x-1;xx<=x+1;xx++)seen.add(xx+','+yy)}function render(){if(inCombat){renderCombat();return}document.getElementById('controls').style.display='block';document.getElementById('combat').style.display='none';document.getElementById('mapPanel').style.display='block';document.getElementById('locationTitle').textContent='YOUR SURROUNDINGS';renderView();document.getElementById('description').textContent=describe();let out='';for(let yy=0;yy<grid.length;yy++){for(let xx=0;xx<grid[0].length;xx++){let k=xx+','+yy;if(xx==x&&yy==y)out+='^>v<'[dir];else if(!seen.has(k))out+=' ';else out+=grid[yy][xx]=='#'?'█':'·'}out+='\n'}document.getElementById('map').textContent=out}function renderView(){const v=document.getElementById('view');v.innerHTML='';const W=v.clientWidth||490,H=v.clientHeight||245;const frames=[{l:0,r:W,t:0,b:H},{l:54,r:W-54,t:31,b:H-31},{l:100,r:W-100,t:57,b:H-57},{l:137,r:W-137,t:78,b:H-78},{l:166,r:W-166,t:94,b:H-94}];const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.setAttribute('width','100%');svg.setAttribute('height','100%');svg.style.position='absolute';svg.style.inset='0';const line=(x1,y1,x2,y2)=>{let e=document.createElementNS('http://www.w3.org/2000/svg','line');e.setAttribute('x1',x1);e.setAttribute('y1',y1);e.setAttribute('x2',x2);e.setAttribute('y2',y2);e.setAttribute('stroke','#b9a06a');e.setAttribute('stroke-width','2');svg.appendChild(e)};const front=f=>{line(f.l,f.t,f.r,f.t);line(f.r,f.t,f.r,f.b);line(f.r,f.b,f.l,f.b);line(f.l,f.b,f.l,f.t)};const wall=(side,a,b)=>{let ax=side==='L'?a.l:a.r,bx=side==='L'?b.l:b.r;line(ax,a.t,bx,b.t);line(ax,a.b,bx,b.b);line(bx,b.t,bx,b.b)};const opening=(side,a,b)=>{let ax=side==='L'?a.l:a.r,bx=side==='L'?b.l:b.r,sgn=side==='L'?-1:1;line(ax,a.t,bx,b.t);line(ax,a.b,bx,b.b);let span=Math.max(12,Math.abs(ax-bx)*.62),ox=bx+sgn*span;line(bx,b.t,ox,b.t);line(bx,b.b,ox,b.b);line(ox,b.t,ox,b.b)};const[dx,dy]=dirs[dir],[ldx,ldy]=dirs[(dir+3)%4],[rdx,rdy]=dirs[(dir+1)%4];let blocked=false;for(let d=0;d<4;d++){let px=x+dx*d,py=y+dy*d,a=frames[d],b=frames[d+1];wallAt(px+ldx,py+ldy)?wall('L',a,b):opening('L',a,b);wallAt(px+rdx,py+rdy)?wall('R',a,b):opening('R',a,b);if(wallAt(px+dx,py+dy)){front(b);blocked=true;break}}if(!blocked)front(frames[4]);v.appendChild(svg)}function startCombat(){stopRepeat();inCombat=true;enemyHP=12;say('A SKELETON rises from the darkness!');renderCombat()}function renderCombat(){document.getElementById('controls').style.display='none';document.getElementById('combat').style.display='block';document.getElementById('mapPanel').style.display='none';document.getElementById('locationTitle').textContent='ENCOUNTER';document.getElementById('description').textContent='A rusted blade hangs in the skeletal warrior’s hand.';document.getElementById('hp').textContent=`YOU ${playerHP}/20 HP   ·   SKELETON ${Math.max(0,enemyHP)}/12 HP`;document.getElementById('view').innerHTML="<div class='enemy'>☠</div><div class='enemyName'>SKELETON</div>"}function combatAction(a){if(!inCombat)return;if(a==='run'){if(Math.random()<.65){say('You escape into the corridor.');endCombat(false);return}else say('You fail to escape!')}else if(a==='spell'){say('You know no spells yet.')}else if(a==='fight'){let d=3+Math.floor(Math.random()*5);enemyHP-=d;say('You strike the Skeleton for '+d+' damage.')}else say('You brace for the attack.');if(enemyHP<=0){say('The Skeleton collapses into a heap of bones. Victory!');endCombat(true);return}let ed=1+Math.floor(Math.random()*4);if(a==='defend')ed=Math.max(0,ed-2);playerHP-=ed;say(ed?'The Skeleton hits you for '+ed+' damage.':'The blow glances harmlessly away.');if(playerHP<=0){playerHP=20;say('You fall... and awaken at the dungeon entrance.');x=1;y=1;dir=1;endCombat(true);return}renderCombat();autosave()}function endCombat(defeated){inCombat=false;if(defeated)encounterDone=true;render();autosave()}function say(t){let l=document.getElementById('log');l.innerHTML+=t+'<br>';l.scrollTop=l.scrollHeight}function autosave(){try{localStorage.setItem('mc_save_v014',JSON.stringify({x,y,dir,seen:[...seen],playerHP,encounterDone}))}catch(e){}}function save(){autosave();say('Your expedition has been saved.')}function restart(){stopRepeat();inCombat=false;x=1;y=1;dir=1;playerHP=20;encounterDone=false;seen=new Set();try{localStorage.removeItem('mc_save_v014')}catch(e){}reveal();render();say('The dungeon resets around you.')}function start(){try{let s=localStorage.getItem('mc_save_v014')||localStorage.getItem('mc_save_v013')||localStorage.getItem('mc_save_v012');if(s){let z=JSON.parse(s);x=z.x??x;y=z.y??y;dir=z.dir??dir;seen=new Set(z.seen||[]);playerHP=z.playerHP??20;encounterDone=z.encounterDone??false}}catch(e){}reveal();render();say('Cold air rises from the dark.')}const action=k=>k==='w'?move(1):k==='s'?move(-1):k==='a'?turn(-1):turn(1);let repeatDelay=null,repeatTimer=null,held=null;function stopRepeat(){clearTimeout(repeatDelay);clearInterval(repeatTimer);repeatDelay=repeatTimer=null;held=null}function beginRepeat(k){if(held||inCombat)return;held=k;action(k);repeatDelay=setTimeout(()=>{repeatTimer=setInterval(()=>{if(!action(k)&&(k==='w'||k==='s'))stopRepeat()},125)},500)}document.querySelectorAll('.key').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture?.(e.pointerId);beginRepeat(b.dataset.action)});b.addEventListener('pointerup',stopRepeat);b.addEventListener('pointercancel',stopRepeat);b.addEventListener('lostpointercapture',stopRepeat);b.addEventListener('contextmenu',e=>e.preventDefault())});document.addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(!'wasd'.includes(k))return;e.preventDefault();if(!e.repeat)beginRepeat(k)});document.addEventListener('keyup',e=>{if('wasd'.includes(e.key.toLowerCase()))stopRepeat()});window.addEventListener('blur',stopRepeat);requestAnimationFrame(start);</script></div></body></html>
