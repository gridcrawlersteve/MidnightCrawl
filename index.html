<!doctype html><html><head><meta name='viewport' content='width=device-width,initial-scale=1,user-scalable=no'><title>Midnight Crawl Prototype</title><style>
body{margin:0;background:#0b0907;color:#ead9ad;font-family:Georgia,serif;display:flex;justify-content:center}.app{width:min(100vw,520px);min-height:100vh;background:#15100b;padding:14px;box-sizing:border-box}.panel{border:1px solid #725c34;background:#100d09;padding:12px;margin:8px 0}h1{font-size:22px;text-align:center;margin:4px}.muted{color:#a99772;font-size:13px}.roster{display:grid;grid-template-columns:1fr 1fr;gap:6px}.char{padding:8px;border:1px solid #4d422d;background:#19140d}.char.sel{outline:2px solid #b99752}.name{font-weight:bold}.btn{background:#2a2114;color:#f2dfad;border:1px solid #8c713d;padding:10px;margin:4px;font:inherit}.btn:active{background:#49391f}.view{height:245px;position:relative;overflow:hidden;background:#030303;border:1px solid #75603a}.wall{position:absolute;border:2px solid #b9a06a;box-sizing:border-box}.map{font-family:monospace;white-space:pre;line-height:11px;font-size:11px;background:#050505;color:#bda873;padding:7px;overflow:auto}.party{font-family:monospace;font-size:12px}.controls{text-align:center}.log{height:70px;overflow:auto;font-size:13px}.hidden{display:none}</style></head><body><div class='app'>
<h1>⚔ MIDNIGHT CRAWL ⚔</h1><div class='muted' style='text-align:center'>Sword & sorcery dungeon prototype · v0.2</div>
<div id='tavern'><div class='panel'><b>THE CROOKED TORCH TAVERN</b><p class='muted'>Choose up to six patrons, then descend beneath the tavern.</p><div id='roster' class='roster'></div><button class='btn' style='width:100%' onclick='enterDungeon()'>DESCEND INTO THE DUNGEON</button></div></div>
<div id='game' class='hidden'><div class='view' id='view'></div><div class='panel party' id='party'></div><div class='controls'><button class='btn' onclick='turn(-1)'>↶ TURN</button><button class='btn' onclick='move(1)'>▲ FORWARD</button><button class='btn' onclick='turn(1)'>TURN ↷</button><br><button class='btn' onclick='move(-1)'>▼ BACK</button><button class='btn' onclick='save()'>SAVE</button><button class='btn' onclick='resetGame()'>TAVERN</button></div><div class='panel'><b>AUTOMAP</b><div id='map' class='map'></div></div><div class='panel log' id='log'></div></div>
<script>
const chars=[['Crom','Barbarian','Fearless · blunt'],['Scarlet Veira','Warrior','Proud · defiant'],['Kael of the Beasts','Ranger','Loyal · instinctive'],['Graves','Rogue','Greedy · cunning'],['Athora','Fighter','Brave · idealistic'],['Cullis','Warrior-King','Honorable · proud'],['Hawke','Swordmaster','Stoic · vengeful'],['Mesthar','Sorcerer','Arrogant · mysterious']];
let chosen=[]; const R=document.getElementById('roster'); chars.forEach((c,i)=>{let d=document.createElement('div');d.className='char';d.innerHTML=`<div class=name>${c[0]}</div><div>${c[1]}</div><div class=muted>${c[2]}</div>`;d.onclick=()=>{if(chosen.includes(i)){chosen=chosen.filter(x=>x!=i);d.classList.remove('sel')}else if(chosen.length<6){chosen.push(i);d.classList.add('sel')}};R.appendChild(d)});
const grid=["###############","#.....#.......#","#.###.#.#####.#","#.#...#.....#.#","#.#.#######.#.#","#.#.........#.#","#.###########.#","#.............#","###.#######.###","#...#.....#...#","#.###.###.###.#","#.....#.#.....#","#####.#.#####.#","#.............#","###############"];
let x=1,y=1,dir=1,seen=new Set(); const dirs=[[0,-1],[1,0],[0,1],[-1,0]];
function getSave(){try{return window.localStorage ? window.localStorage.getItem('mc_save') : null}catch(e){return null}}
function putSave(data){try{if(window.localStorage) window.localStorage.setItem('mc_save',data)}catch(e){}}
function enterDungeon(){if(!chosen.length) chosen=[0,1,2,3,4,7];document.getElementById('tavern').classList.add('hidden');document.getElementById('game').classList.remove('hidden');let s=getSave();if(s){try{let z=JSON.parse(s);x=z.x??x;y=z.y??y;dir=z.dir??dir;seen=new Set(z.seen||[]);chosen=z.chosen?.length?z.chosen:chosen}catch(e){}} reveal();requestAnimationFrame(()=>{render();say('The tavern door slams above you. Cold air rises from the dark.')})}
function wallAt(xx,yy){return !grid[yy]||grid[yy][xx]=='#'} function move(n){let [dx,dy]=dirs[dir];let nx=x+dx*n,ny=y+dy*n;if(wallAt(nx,ny)){say('Stone blocks your path.');return}x=nx;y=ny;reveal();render(); if((x+y)%7==0)say(chars[chosen[Math.floor(Math.random()*chosen.length)]][0]+': “I do not like this place.”');autosave()}
function turn(n){dir=(dir+n+4)%4;render();autosave()} function reveal(){for(let yy=y-1;yy<=y+1;yy++)for(let xx=x-1;xx<=x+1;xx++)seen.add(xx+','+yy)}
function render(){renderView();let out='';for(let yy=0;yy<grid.length;yy++){for(let xx=0;xx<grid[0].length;xx++){let k=xx+','+yy;if(xx==x&&yy==y)out+='^>v<'[dir];else if(!seen.has(k))out+=' ';else out+=grid[yy][xx]=='#'?'█':'·'}out+='\n'}document.getElementById('map').textContent=out;document.getElementById('party').innerHTML=chosen.map(i=>`${chars[i][0].padEnd(16)} HP 12/12`).join('<br>')}
function renderView(){let v=document.getElementById('view');v.innerHTML='';let [dx,dy]=dirs[dir];for(let depth=4;depth>=1;depth--){let xx=x+dx*depth,yy=y+dy*depth;let inset=depth*22,w=v.clientWidth-inset*2,h=245-inset*1.7,top=(245-h)/2;if(wallAt(xx,yy)){let d=document.createElement('div');d.className='wall';d.style=`left:${inset}px;top:${top}px;width:${w}px;height:${h}px`;v.appendChild(d)}}let f=document.createElement('div');f.style='position:absolute;bottom:8px;width:100%;text-align:center;color:#766647;font-size:12px';f.textContent=['NORTH','EAST','SOUTH','WEST'][dir];v.appendChild(f)}
function say(t){let l=document.getElementById('log');l.innerHTML+=t+'<br>';l.scrollTop=l.scrollHeight}function autosave(){putSave(JSON.stringify({x,y,dir,seen:[...seen],chosen}))}function save(){autosave();say('Your expedition has been saved.')}function resetGame(){autosave();location.reload()}
</script></div></body></html>
