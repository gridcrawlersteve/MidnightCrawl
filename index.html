<!doctype html><html><head><meta name='viewport' content='width=device-width,initial-scale=1,user-scalable=no'><title>Midnight Crawl Prototype</title><style>body{margin:0;background:#0b0907;color:#ead9ad;font-family:Georgia,serif;display:flex;justify-content:center}.app{width:min(100vw,520px);min-height:100vh;background:#15100b;padding:14px;box-sizing:border-box}.panel{border:1px solid #725c34;background:#100d09;padding:12px;margin:8px 0}h1{font-size:22px;text-align:center;margin:4px}.muted{color:#a99772;font-size:13px}.btn{background:#2a2114;color:#f2dfad;border:1px solid #8c713d;padding:10px;margin:4px;font:inherit}.btn:active{background:#49391f}.view{height:245px;position:relative;overflow:hidden;background:#030303;border:1px solid #75603a}.map{font-family:monospace;white-space:pre;line-height:11px;font-size:11px;background:#050505;color:#bda873;padding:7px;overflow:auto}.controls{text-align:center}.log{height:70px;overflow:auto;font-size:13px}</style></head><body><div class='app'><h1>⚔ MIDNIGHT CRAWL ⚔</h1><div class='muted' style='text-align:center'>Sword & sorcery dungeon prototype · v0.5</div><div class='view' id='view'></div><div class='controls'><button class='btn' onclick='turn(-1)'>↶ TURN</button><button class='btn' onclick='move(1)'>▲ FORWARD</button><button class='btn' onclick='turn(1)'>TURN ↷</button><br><button class='btn' onclick='move(-1)'>▼ BACK</button><button class='btn' onclick='save()'>SAVE</button><button class='btn' onclick='restart()'>RESTART</button></div><div class='panel'><b>AUTOMAP</b><div id='map' class='map'></div></div><div class='panel log' id='log'></div><script>const grid=["###############","#.....#.......#","#.###.#.#####.#","#.#...#.....#.#","#.#.#######.#.#","#.#.........#.#","#.###########.#","#.............#","###.#######.###","#...#.....#...#","#.###.###.###.#","#.....#.#.....#","#####.#.#####.#","#.............#","###############"];let x=1,y=1,dir=1,seen=new Set();const dirs=[[0,-1],[1,0],[0,1],[-1,0]];function wallAt(xx,yy){return !grid[yy]||grid[yy][xx]=='#'}function move(n){let[dx,dy]=dirs[dir],nx=x+dx*n,ny=y+dy*n;if(wallAt(nx,ny)){say('Stone blocks your path.');return}x=nx;y=ny;reveal();render();autosave()}function turn(n){dir=(dir+n+4)%4;render();autosave()}function reveal(){for(let yy=y-1;yy<=y+1;yy++)for(let xx=x-1;xx<=x+1;xx++)seen.add(xx+','+yy)}function render(){renderView();let out='';for(let yy=0;yy<grid.length;yy++){for(let xx=0;xx<grid[0].length;xx++){let k=xx+','+yy;if(xx==x&&yy==y)out+='^>v<'[dir];else if(!seen.has(k))out+=' ';else out+=grid[yy][xx]=='#'?'█':'·'}out+='\n'}document.getElementById('map').textContent=out}function renderView(){const v=document.getElementById('view');v.innerHTML='';const W=v.clientWidth||490,H=v.clientHeight||245;const frames=[{l:0,r:W,t:0,b:H},{l:48,r:W-48,t:28,b:H-28},{l:91,r:W-91,t:52,b:H-52},{l:127,r:W-127,t:72,b:H-72},{l:155,r:W-155,t:87,b:H-87}];const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.setAttribute('width','100%');svg.setAttribute('height','100%');svg.style.position='absolute';svg.style.inset='0';const line=(x1,y1,x2,y2)=>{let e=document.createElementNS('http://www.w3.org/2000/svg','line');e.setAttribute('x1',x1);e.setAttribute('y1',y1);e.setAttribute('x2',x2);e.setAttribute('y2',y2);e.setAttribute('stroke','#b9a06a');e.setAttribute('stroke-width','2');svg.appendChild(e)};const rect=f=>{line(f.l,f.t,f.r,f.t);line(f.r,f.t,f.r,f.b);line(f.r,f.b,f.l,f.b);line(f.l,f.b,f.l,f.t)};const[dx,dy]=dirs[dir],[ldx,ldy]=dirs[(dir+3)%4],[rdx,rdy]=dirs[(dir+1)%4];let blocked=false,last=0;for(let d=0;d<4;d++){const px=x+dx*d,py=y+dy*d,a=frames[d],b=frames[d+1];last=d;const leftWall=wallAt(px+ldx,py+ldy),rightWall=wallAt(px+rdx,py+rdy);if(leftWall){line(a.l,a.t,b.l,b.t);line(a.l,a.b,b.l,b.b);line(b.l,b.t,b.l,b.b)}else{line(a.l,a.t,b.l,b.t);line(a.l,a.b,b.l,b.b);line(a.l,a.t,a.l,a.t+(a.b-a.t)*.24);line(a.l,a.b,a.l,a.b-(a.b-a.t)*.24)}if(rightWall){line(a.r,a.t,b.r,b.t);line(a.r,a.b,b.r,b.b);line(b.r,b.t,b.r,b.b)}else{line(a.r,a.t,b.r,b.t);line(a.r,a.b,b.r,b.b);line(a.r,a.t,a.r,a.t+(a.b-a.t)*.24);line(a.r,a.b,a.r,a.b-(a.b-a.t)*.24)}if(wallAt(px+dx,py+dy)){rect(b);blocked=true;break}}if(!blocked)rect(frames[Math.min(last+1,4)]);v.appendChild(svg);let f=document.createElement('div');f.style='position:absolute;bottom:8px;width:100%;text-align:center;color:#766647;font-size:12px';f.textContent=['NORTH','EAST','SOUTH','WEST'][dir];v.appendChild(f)}function say(t){let l=document.getElementById('log');l.innerHTML+=t+'<br>';l.scrollTop=l.scrollHeight}function autosave(){try{localStorage.setItem('mc_save_v05',JSON.stringify({x,y,dir,seen:[...seen]}))}catch(e){}}function save(){autosave();say('Your expedition has been saved.')}function restart(){x=1;y=1;dir=1;seen=new Set();try{localStorage.removeItem('mc_save_v05')}catch(e){}reveal();render();say('The dungeon resets around you.')}function start(){try{let s=localStorage.getItem('mc_save_v05');if(s){let z=JSON.parse(s);x=z.x??x;y=z.y??y;dir=z.dir??dir;seen=new Set(z.seen||[])}}catch(e){}reveal();render();say('Cold air rises from the dark.')}requestAnimationFrame(start);</script></div></body></html>
