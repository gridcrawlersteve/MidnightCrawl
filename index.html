<!doctype html><html><head><meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no'><title>Midnight Crawl Prototype</title><style>html,body{touch-action:manipulation}body{margin:0;background:#0b0907;color:#ead9ad;font-family:Georgia,serif;display:flex;justify-content:center}.app{width:min(100vw,520px);min-height:100vh;background:#15100b;padding:14px;box-sizing:border-box}.panel{border:1px solid #725c34;background:#100d09;padding:12px;margin:8px 0}h1{font-size:22px;text-align:center;margin:4px}.muted{color:#a99772;font-size:13px}.btn{background:#2a2114;color:#f2dfad;border:1px solid #8c713d;padding:10px;margin:4px;font:inherit;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}.btn:active{background:#49391f}.view{height:245px;position:relative;overflow:hidden;background:#030303;border:1px solid #75603a}.location{border:1px solid #4d422d;background:#0d0b08;padding:10px 12px;margin:8px 0;text-align:center;min-height:42px}.location b{display:block;font-size:12px;letter-spacing:1px;color:#8f7a50;margin-bottom:4px}.location span{font-size:14px;line-height:1.35}.map{font-family:monospace;white-space:pre;line-height:11px;font-size:11px;background:#050505;color:#bda873;padding:7px;overflow:auto}.controls{text-align:center;margin:10px 0;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}.wasd{display:grid;grid-template-columns:58px 58px 58px;grid-template-rows:58px 58px;gap:6px;justify-content:center;touch-action:none}.key{width:58px;height:58px;margin:0;padding:0;font-size:24px;font-weight:bold;touch-action:none}.key.w{grid-column:2;grid-row:1}.key.a{grid-column:1;grid-row:2}.key.s{grid-column:2;grid-row:2}.key.d{grid-column:3;grid-row:2}.utility{text-align:center;margin-top:8px}.utility .btn{padding:7px 14px;font-size:13px;color:#bdaa80}.log{height:70px;overflow:auto;font-size:13px}</style></head><body><div class='app'><h1>⚔ MIDNIGHT CRAWL ⚔</h1><div class='muted' style='text-align:center'>Sword & sorcery dungeon prototype · v0.13</div><div class='view' id='view'></div><div class='location'><b>YOUR SURROUNDINGS</b><span id='description'></span></div><div class='controls'><div class='wasd'><button class='btn key w' data-action='w' aria-label='Forward'>W</button><button class='btn key a' data-action='a' aria-label='Turn left'>A</button><button class='btn key s' data-action='s' aria-label='Back'>S</button><button class='btn key d' data-action='d' aria-label='Turn right'>D</button></div><div class='utility'><button class='btn' onclick='save()'>SAVE</button><button class='btn' onclick='restart()'>RESTART</button></div></div><div class='panel'><b>AUTOMAP</b><div id='map' class='map'></div></div><div class='panel log' id='log'></div><script>const grid=["###############","#.....#.......#","#.###.#.#####.#","#.#...#.....#.#","#.#.#######.#.#","#.#.........#.#","#.###########.#","#.............#","###.#######.###","#...#.....#...#","#.###.###.###.#","#.....#.#.....#","#####.#.#####.#","#.............#","###############"];let x=1,y=1,dir=1,seen=new Set();const dirs=[[0,-1],[1,0],[0,1],[-1,0]];const special={"1,1":"Rough-hewn steps disappear upward behind you. The passage ahead smells of wet stone and old smoke.","5,1":"A cramped corner where soot stains the ceiling. Something has scratched three deep marks into the stone.","7,3":"The masonry here is older. Thin roots push through the mortar like black veins.","7,5":"A long, cold gallery. Water ticks steadily somewhere beyond the walls.","3,7":"The corridor widens slightly around a cracked flagstone carved with an unfamiliar sigil.","11,7":"A stale draft moves through this junction, carrying the faint smell of iron.","5,9":"Broken pottery crunches underfoot. A shallow niche has been hacked into the wall.","9,9":"The ceiling arches higher here, vanishing into darkness above the reach of your light.","7,13":"A broad underground passage stretches through ancient masonry. Your footsteps return as distant echoes."};function wallAt(xx,yy){return !grid[yy]||grid[yy][xx]=='#'}function describe(){let key=x+','+y;if(special[key])return special[key];let open=[];for(let i=0;i<4;i++){let[dxx,dyy]=dirs[i];if(!wallAt(x+dxx,y+dyy))open.push(i)}if(open.length>=4)return'Four passages meet in a broad stone crossing. Cold air moves through the intersection.';if(open.length===3)return'A three-way junction opens through worn stonework. Shadows gather in each branching passage.';if(open.length===2&&((open[0]+2)%4===open[1]))return'A narrow stone corridor runs through the darkness. Damp mortar glistens between uneven blocks.';if(open.length===2)return'The passage bends sharply here. The inner corner is chipped and worn by age.';if(open.length===1)return'The passage ends at a blank wall of fitted stone. Dust lies thick in the corners.';return'A sealed pocket of ancient masonry closes around you.'}function move(n){let[dx,dy]=dirs[dir],nx=x+dx*n,ny=y+dy*n;if(wallAt(nx,ny)){say('Stone blocks your path.');return false}x=nx;y=ny;reveal();render();autosave();return true}function turn(n){dir=(dir+n+4)%4;render();autosave();return true}function reveal(){for(let yy=y-1;yy<=y+1;yy++)for(let xx=x-1;xx<=x+1;xx++)seen.add(xx+','+yy)}function render(){renderView();document.getElementById('description').textContent=describe();let out='';for(let yy=0;yy<grid.length;yy++){for(let xx=0;xx<grid[0].length;xx++){let k=xx+','+yy;if(xx==x&&yy==y)out+='^>v<'[dir];else if(!seen.has(k))out+=' ';else out+=grid[yy][xx]=='#'?'█':'·'}out+='\n'}document.getElementById('map').textContent=out}function renderView(){const v=document.getElementById('view');v.innerHTML='';const W=v.clientWidth||490,H=v.clientHeight||245;const frames=[{l:0,r:W,t:0,b:H},{l:54,r:W-54,t:31,b:H-31},{l:100,r:W-100,t:57,b:H-57},{l:137,r:W-137,t:78,b:H-78},{l:166,r:W-166,t:94,b:H-94}];const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.setAttribute('width','100%');svg.setAttribute('height','100%');svg.style.position='absolute';svg.style.inset='0';const line=(x1,y1,x2,y2)=>{let e=document.createElementNS('http://www.w3.org/2000/svg','line');e.setAttribute('x1',x1);e.setAttribute('y1',y1);e.setAttribute('x2',x2);e.setAttribute('y2',y2);e.setAttribute('stroke','#b9a06a');e.setAttribute('stroke-width','2');e.setAttribute('stroke-linecap','square');svg.appendChild(e)};const front=f=>{line(f.l,f.t,f.r,f.t);line(f.r,f.t,f.r,f.b);line(f.r,f.b,f.l,f.b);line(f.l,f.b,f.l,f.t)};const wall=(side,a,b)=>{let ax=side==='L'?a.l:a.r,bx=side==='L'?b.l:b.r;line(ax,a.t,bx,b.t);line(ax,a.b,bx,b.b);line(bx,b.t,bx,b.b)};const opening=(side,a,b)=>{let ax=side==='L'?a.l:a.r,bx=side==='L'?b.l:b.r,sgn=side==='L'?-1:1;line(ax,a.t,bx,b.t);line(ax,a.b,bx,b.b);let span=Math.max(12,Math.abs(ax-bx)*.62),ox=bx+sgn*span;line(bx,b.t,ox,b.t);line(bx,b.b,ox,b.b);line(ox,b.t,ox,b.b)};const[dx,dy]=dirs[dir],[ldx,ldy]=dirs[(dir+3)%4],[rdx,rdy]=dirs[(dir+1)%4];let blocked=false;for(let d=0;d<4;d++){let px=x+dx*d,py=y+dy*d,a=frames[d],b=frames[d+1];wallAt(px+ldx,py+ldy)?wall('L',a,b):opening('L',a,b);wallAt(px+rdx,py+rdy)?wall('R',a,b):opening('R',a,b);if(wallAt(px+dx,py+dy)){front(b);blocked=true;break}}if(!blocked)front(frames[4]);v.appendChild(svg);let f=document.createElement('div');f.style='position:absolute;bottom:8px;width:100%;text-align:center;color:#766647;font-size:12px';f.textContent=['NORTH','EAST','SOUTH','WEST'][dir];v.appendChild(f)}function say(t){let l=document.getElementById('log');l.innerHTML+=t+'<br>';l.scrollTop=l.scrollHeight}function autosave(){try{localStorage.setItem('mc_save_v013',JSON.stringify({x,y,dir,seen:[...seen]}))}catch(e){}}function save(){autosave();say('Your expedition has been saved.')}function restart(){stopRepeat();x=1;y=1;dir=1;seen=new Set();try{localStorage.removeItem('mc_save_v013')}catch(e){}reveal();render();say('The dungeon resets around you.')}function start(){try{let s=localStorage.getItem('mc_save_v013')||localStorage.getItem('mc_save_v012')||localStorage.getItem('mc_save_v011')||localStorage.getItem('mc_save_v010')||localStorage.getItem('mc_save_v09')||localStorage.getItem('mc_save_v08');if(s){let z=JSON.parse(s);x=z.x??x;y=z.y??y;dir=z.dir??dir;seen=new Set(z.seen||[])}}catch(e){}reveal();render();say('Cold air rises from the dark.')}const action=k=>k==='w'?move(1):k==='s'?move(-1):k==='a'?turn(-1):turn(1);let repeatDelay=null,repeatTimer=null,held=null;function stopRepeat(){clearTimeout(repeatDelay);clearInterval(repeatTimer);repeatDelay=repeatTimer=null;held=null}function beginRepeat(k){if(held)return;held=k;action(k);repeatDelay=setTimeout(()=>{repeatTimer=setInterval(()=>{if(!action(k)&&(k==='w'||k==='s'))stopRepeat()},125)},325)}document.querySelectorAll('.key').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture?.(e.pointerId);beginRepeat(b.dataset.action)});b.addEventListener('pointerup',stopRepeat);b.addEventListener('pointercancel',stopRepeat);b.addEventListener('lostpointercapture',stopRepeat);b.addEventListener('contextmenu',e=>e.preventDefault())});document.addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(!'wasd'.includes(k))return;e.preventDefault();if(!e.repeat)beginRepeat(k)});document.addEventListener('keyup',e=>{if('wasd'.includes(e.key.toLowerCase())){e.preventDefault();stopRepeat()}});window.addEventListener('blur',stopRepeat);document.addEventListener('visibilitychange',()=>{if(document.hidden)stopRepeat()});let lastTouchEnd=0;document.querySelector('.controls').addEventListener('touchend',e=>{const now=Date.now();if(now-lastTouchEnd<=300)e.preventDefault();lastTouchEnd=now},{passive:false});document.querySelector('.controls').addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});requestAnimationFrame(start);</script></div></body></html>
